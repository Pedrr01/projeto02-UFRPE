<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(to right, rgb(20, 147, 220), rgb(17, 54, 71));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .container input, .container button {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
        }
        .container input {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .container button {
            background-color: rgb(0, 92, 197);
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .container button:hover {
            background-color: rgb(0, 80, 172);
        }
        .container h2 {
            margin-bottom: 20px;
        }
        .back-button {
            background-color: rgb(120, 120, 120);
            margin-top: 10px;
        }
        .back-button:hover {
            background-color: rgb(100, 100, 100);
        }
        
        /* Definir classes para as mensagens */
        .success-message {
            color: green;
        }
        .error-message {
            color: red;
        }

        /* Evitar o marcador de lista */
        .message {
            margin: 0;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Recuperar Senha</h2>

        <form action="{{ url_for('verificar_recuperacao') }}" method="POST">
            <input type="text" name="username" placeholder="Usuário" required>
            <input type="email" name="email" placeholder="E-mail" required>
            
            <button type="button" class="back-button" onclick="window.history.back()">Voltar</button>
            <button type="submit">Recuperar Senha</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="message {{ 'success-message' if category == 'success' else 'error-message' }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
