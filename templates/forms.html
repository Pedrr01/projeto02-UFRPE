<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/iconNav.png" type="image/x-icon">
    <title>Campus Link - UFRPE</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(to right, rgb(20, 147, 220), rgb(17, 54, 71));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .caixa {
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            width: 40%;
            text-align: center;
        }
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .profile-picture input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .caixaInput {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        .inputUsuario {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid white;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 5px;
        }
        .labelInput {
            position: absolute;
            top: 5px;
            left: 5px;
            transition: .3s;
            color: white;
        }
        .inputUsuario:focus ~ .labelInput,
        .inputUsuario:valid ~ .labelInput {
            top: -15px;
            font-size: 12px;
            color: dodgerblue;
        }
        #botaoCadastrar {
            width: 100%;
            border: none;
            padding: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            background-image: linear-gradient(to right, rgb(0, 92, 197), rgb(90, 20, 220));
        }
        #botaoCadastrar:hover {
            background-image: linear-gradient(to right, rgb(0, 80, 172), rgb(80, 19, 195));
        }
        .mensagemErro {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        .containerAncora {
            padding-top: 15px;
            text-align: center;
        }
        a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <form id="formularioCadastro" action="/register" method="POST" enctype="multipart/form-data">
            <div class="profile-picture">
                <img src="default-profile.png" alt="Foto de Perfil" id="profile-img" style="display: none;">
                <input type="file" name="profile_picture" accept="image/*" onchange="loadFile(event)">
            </div>
            
            <div class="caixaInput">
                <input type="text" name="name" id="nome" class="inputUsuario" required>
                <label for="nome" class="labelInput">Nome de Usuário</label>
            </div>
            <div class="caixaInput">
                <input type="email" name="email" id="email" class="inputUsuario" required>
                <label for="email" class="labelInput">Email</label>
            </div>
            <div class="caixaInput">
                <input type="password" name="password" id="senha" class="inputUsuario" required>
                <label for="senha" class="labelInput">Senha</label>
            </div>
            <div class="caixaInput">
                <input type="password" name="confirm_password" id="confirmacao_senha" class="inputUsuario" required>
                <label for="confirmacao_senha" class="labelInput">Confirmação de Senha</label>
            </div>
            <div class="caixaInput">
                <input type="text" name="faculdade" id="faculdade" class="inputUsuario" required>
                <label for="faculdade" class="labelInput">Faculdade</label>
            </div>
            <div class="caixaInput">
                <input type="text" name="curso" id="curso" class="inputUsuario" required>
                <label for="curso" class="labelInput">Curso</label>
            </div>
            <div class="caixaInput">
                <input type="text" name="periodo" id="periodo" class="inputUsuario" required>
                <label for="periodo" class="labelInput">Período</label>
            </div>
            
            <input type="submit" id="botaoCadastrar" value="Cadastrar">
        </form>
        <div class="containerAncora">
            <a href="/">Voltar</a>
        </div>
    </div>

    <script>
        var loadFile = function(event) {
            var output = document.getElementById('profile-img');
            output.style.display = 'block';
            output.src = URL.createObjectURL(event.target.files[0]);
        };
    </script>
</body>
</html>
